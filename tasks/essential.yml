---

- name: ensure tasks run only on selected os releases
  block:

    - name: install python3-libdnf(5)
      block:

        - name: install python3-libdnf5
          ansible.builtin.command:
            cmd: dnf install -y python3-libdnf5
          register: python_dnf
          changed_when: "'already installed' not in python_dnf.stderr"

        - name: display python3-libdnf5 install result
          ansible.builtin.debug:
            var: python_dnf
            verbosity: 1

      rescue:

        - name: install python3-libdnf
          ansible.builtin.command:
            cmd: dnf install -y python3-libdnf
          register: python_dnf
          changed_when: "'already installed' not in python_dnf.stderr"

        - name: display python3-libdnf install result
          ansible.builtin.debug:
            var: python_dnf
            verbosity: 1

      when: os_id.stdout != "bazzite"

    - name: package updates
      block:

        - name: update installed packages using root
          ansible.builtin.shell:
            cmd: "$(which topgrade) --config {{ ansible_work_dir.path }}/topgrade_root.toml --skip-notify"
          register: ujust_update_root

        - name: display ujust root output
          ansible.builtin.debug:
            var: ujust_update_root.stdout
            verbosity: 1

        - name: "update installed packages using {{ ansible_user }}"
          ansible.builtin.shell:
            cmd: "$(which topgrade) --config {{ ansible_work_dir.path }}/topgrade_user.toml --skip-notify"
          register: ujust_update_user
          vars:
            ansible_become: false

        - name: display ujust user output
          ansible.builtin.debug:
            var: ujust_update_user.stdout
            verbosity: 1

      when: os_id.stdout == "bazzite"

    - name: package updates
      block:

        - name: update installed packages
          ansible.builtin.package:
            name: "*"
            state: latest

        - name: install additional packages
          ansible.builtin.package:
            name: "{{ baseline_packages }}"
            state: present

      when: os_id.stdout != "bazzite"

    - name: display grub menu
      ansible.builtin.include_role:
        name: boot_loader
        tasks_from: grub_settings.yml
      vars:
        grub_settings:
          - key: GRUB_HIDDEN_TIMEOUT
            value: 0
          - key: GRUB_TIMEOUT_STYLE
            value: menu
          - key: GRUB_TIMEOUT
            value: 5

    - name: remove default kernel arguments
      ansible.builtin.include_role:
        name: boot_loader
        tasks_from: kernel_arguments.yml
      vars:
        grubby_task: remove
        kernel_arguments:
          - crashkernel
          - quiet
          - rhgb

    - name: execute handlers
      meta: flush_handlers

    - name: reboot system if required
      block:

      - name: check if a reboot is required
        ansible.builtin.command:
          cmd: dnf needs-restarting -r
        changed_when: reboot_needed.rc != 0
        failed_when: false
        notify: initiate reboot
        register: reboot_needed

      - name: display reboot flag
        ansible.builtin.debug:
          var: reboot_needed
          verbosity: 1

      when:
        - reboot is defined
        - reboot

  when: >
    ansible_distribution == "Fedora" or
    ansible_distribution == "RedHat" or
    ansible_distribution == "Rocky"

- ansible.builtin.debug:
    msg: exiting
  failed_when: true

...
